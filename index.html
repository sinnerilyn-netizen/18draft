.beam.three{opacity:.7;filter:blur(34px)}

.jelly-defs{position:absolute;width:0;height:0;overflow:hidden}

.jelly-one{--w:min(19vw,155px);--l:3%;--t:8%;--o:.68;--speed:18s}
.jelly-two{--w:min(24vw,190px);--l:1%;--t:59%;--o:.65;--b:1px;--speed:24s}

.jelly-four{--w:min(10vw,76px);--l:49%;--t:13%;--o:.39;--b:2px;--speed:22s}

 .event-strip{grid-template-columns:1fr;padding:1rem 1.2rem}

<style id="kris1-4-portrait-layout">
/* Kris1–Kris3 editorial placement: transparent cutouts, soft edge masks, and an icy halo. */
.side-portrait {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  margin: 0;
  isolation: isolate;
  pointer-events: none;
}
.side-portrait::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 12% -8% 8%;
  border-radius: 50%;
  background: radial-gradient(ellipse at 50% 48%, rgba(165,232,255,.27), rgba(63,160,255,.11) 43%, transparent 74%);
  filter: blur(30px);
}
.side-portrait-image {
  display: block;
  width: 100%;
  height: auto;
  max-height: 600px;
  object-fit: contain;
  filter: drop-shadow(0 0 17px rgba(133,222,255,.18)) drop-shadow(0 0 36px rgba(70,150,255,.11));
  -webkit-mask-image: radial-gradient(ellipse 83% 92% at 50% 48%, #000 48%, rgba(0,0,0,.96) 64%, rgba(0,0,0,.63) 80%, rgba(0,0,0,.2) 92%, transparent 100%);
  mask-image: radial-gradient(ellipse 83% 92% at 50% 48%, #000 48%, rgba(0,0,0,.96) 64%, rgba(0,0,0,.63) 80%, rgba(0,0,0,.2) 92%, transparent 100%);
}

/* Kris1: close to the left edge of the carousel, with the silhouette fading into blue water. */
.eighteens-feature {
  display: grid;
  grid-template-columns: minmax(170px, .53fr) minmax(0, 1.47fr);
  align-items: center;
  gap: 0;
  margin-top: 1.6rem;
  position: relative;
}
.eighteens-content { min-width: 0; position: relative; z-index: 1; }
.side-portrait--eighteens { z-index: 2; margin-right: -.45rem; }
.side-portrait--eighteens::before { inset: 15% -10% 9%; }
.side-portrait--eighteens .side-portrait-image {
  width: min(122%, 360px);
  max-width: none;
  max-height: 560px;
  -webkit-mask-image: radial-gradient(ellipse 80% 92% at 52% 48%, #000 47%, rgba(0,0,0,.96) 63%, rgba(0,0,0,.58) 80%, rgba(0,0,0,.18) 92%, transparent 100%);
  mask-image: radial-gradient(ellipse 80% 92% at 52% 48%, #000 47%, rgba(0,0,0,.96) 63%, rgba(0,0,0,.58) 80%, rgba(0,0,0,.18) 92%, transparent 100%);
}
.eighteens-content .selector-shell { position: relative; z-index: 1; }
.eighteens-content .selector-footer { margin-bottom: .1rem; }

/* Kris2: right-side portrait balances the blank program template without obscuring its table. */
.program-feature {
  display: grid;
  grid-template-columns: minmax(0, 1.62fr) minmax(190px, .62fr);
  align-items: center;
  gap: 0;
  margin-top: 3.1rem;
  position: relative;
}
.program-feature .program-card { min-width: 0; width: 100%; max-width: none; margin-top: 0; position: relative; z-index: 1; }
.side-portrait--program { z-index: 2; margin-left: -1.45rem; }
.side-portrait--program::before { inset: 13% -18% 7%; }
.side-portrait--program .side-portrait-image {
  width: min(138%, 360px);
  max-width: none;
  max-height: 570px;
  -webkit-mask-image: radial-gradient(ellipse 81% 92% at 52% 48%, #000 45%, rgba(0,0,0,.95) 62%, rgba(0,0,0,.59) 80%, rgba(0,0,0,.16) 93%, transparent 100%);
  mask-image: radial-gradient(ellipse 81% 92% at 52% 48%, #000 45%, rgba(0,0,0,.95) 62%, rgba(0,0,0,.59) 80%, rgba(0,0,0,.16) 93%, transparent 100%);
}

/* Kris3: a more misted portrait at RSVP, gently overlapping the frame's left edge. */
.rsvp-feature {
  display: grid;
  grid-template-columns: minmax(0, .82fr) minmax(0, 1fr);
  align-items: center;
  gap: 0;
  margin-top: 1.3rem;
  position: relative;
}
.rsvp-feature .rsvp-panel {
  width: 100%;
  max-width: none;
  margin: 0;
  position: relative;
  z-index: 1;
}
.side-portrait--rsvp { z-index: 2; margin-right: -3.1rem; }
.side-portrait--rsvp::before {
  inset: 5% -18% 4%;
  background: radial-gradient(ellipse at 50% 54%, rgba(205,244,255,.3), rgba(102,194,255,.14) 42%, transparent 74%);
  filter: blur(42px);
}
.side-portrait--rsvp .side-portrait-image {
  width: min(125%, 400px);
  max-height: 720px;
  filter: drop-shadow(0 0 21px rgba(161,232,255,.2)) drop-shadow(0 0 48px rgba(99,166,255,.13));
  -webkit-mask-image: radial-gradient(ellipse 79% 91% at 51% 48%, #000 35%, rgba(0,0,0,.94) 52%, rgba(0,0,0,.69) 68%, rgba(0,0,0,.32) 82%, rgba(0,0,0,.08) 94%, transparent 100%);
  mask-image: radial-gradient(ellipse 79% 91% at 51% 48%, #000 35%, rgba(0,0,0,.94) 52%, rgba(0,0,0,.69) 68%, rgba(0,0,0,.32) 82%, rgba(0,0,0,.08) 94%, transparent 100%);
}

/* Kris4: the main welcome portrait, with a broad feathered edge and no hard cut-out boundary. */
.portrait-wrap { width: min(95vw, 620px); }
.portrait {
  -webkit-mask-image: radial-gradient(ellipse 90% 96% at 50% 46%, #000 57%, rgba(0,0,0,.97) 70%, rgba(0,0,0,.65) 84%, rgba(0,0,0,.2) 95%, transparent 100%);
  mask-image: radial-gradient(ellipse 90% 96% at 50% 46%, #000 57%, rgba(0,0,0,.97) 70%, rgba(0,0,0,.65) 84%, rgba(0,0,0,.2) 95%, transparent 100%);
  filter: drop-shadow(0 0 24px rgba(140,222,255,.25));
}

@media (max-width: 760px) {
  .eighteens-feature { grid-template-columns: minmax(110px, .42fr) minmax(0, 1.58fr); }
  .side-portrait--eighteens .side-portrait-image { max-height: 470px; }
  .program-feature { grid-template-columns: minmax(0, 1.55fr) minmax(115px, .45fr); }
  .side-portrait--program { margin-left: -1.1rem; }
  .side-portrait--program .side-portrait-image { width: 145%; max-height: 470px; }
  .rsvp-feature { grid-template-columns: minmax(115px, .67fr) minmax(0, 1fr); }
  .side-portrait--rsvp { margin-right: -2rem; }
  .side-portrait--rsvp .side-portrait-image { width: 135%; max-height: 600px; }
}

@media (max-width: 540px) {
  /* Keep the selector and schedule legible on narrow screens while portraits remain as blended side accents. */
  .eighteens-feature { display: block; margin-top: 1rem; }
  .eighteens-content { padding-left: 18px; }
  .side-portrait--eighteens {
    position: absolute;
    left: -38px;
    top: 3%;
    bottom: 2%;
    width: 35%;
    opacity: .62;
    z-index: 0;
  }
  .side-portrait--eighteens .side-portrait-image { width: 100%; max-height: none; }
  .eighteens-content .selector-shell { gap: .24rem; }
  .eighteens-content .selector-arrow { width: 35px; height: 35px; }
  .eighteens-content .carousel-panel { padding: 1.1rem .58rem; }
  .program-feature { display: block; margin-top: 2.8rem; }
  .program-feature .program-card { position: relative; z-index: 1; padding-right: 1rem; }
  .side-portrait--program {
    position: absolute;
    right: -24px;
    top: 175px;
    width: 34%;
    opacity: .47;
    z-index: 2;
  }
  .side-portrait--program .side-portrait-image { width: 160%; max-width: none; max-height: 340px; }
  .rsvp-feature { display: block; margin-top: .8rem; }
  .rsvp-feature .rsvp-panel { position: relative; z-index: 1; background: linear-gradient(145deg, rgba(5,42,83,.74), rgba(8,66,111,.76) 52%, rgba(5,30,68,.82)); }
  .side-portrait--rsvp {
    position: absolute;
    left: -36px;
    top: -38px;
    width: 68%;
    left: -46px;
    z-index: 0;
    opacity: .78;
  }
  .side-portrait--rsvp .side-portrait-image { width: 100%; max-height: 470px; }
  .welcome-heading .section-title { font-size: clamp(4.55rem, 15.5vw, 7rem); }
  #cover h1 { font-size: clamp(5.3rem, 21vw, 8.5rem); }
}
@media (prefers-reduced-motion: reduce) {
  .fog-layer, .side-portrait, .portrait { animation: none !important; }
  .side-portrait-image { transition: none !important; }
}
</style>
